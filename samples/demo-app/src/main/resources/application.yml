spring:
  application:
    name: order-service
  ai:
    mcp:
      server:
        name: order-service
        version: 0.1.0
        # Streamable HTTP on /mcp. Without this, Spring AI falls back to the older SSE transport on /sse.
        protocol: STREAMABLE
        # This app has no @McpTool beans of its own, and boot-mcp-doctor registers its tools without the
        # scanner. Turning it off skips the startup warnings it logs when it finds nothing.
        annotation-scanner:
          enabled: false

boot-mcp-doctor:
  enabled: true
  # set_log_level also needs Spring Security and security.write-authority, which this demo doesn't have.
  read-only: true
  security:
    # The demo has no Spring Security, so it opts in to unauthenticated calls to the read tools.
    # Only do this on a machine nobody else can reach.
    allow-unauthenticated: true

demo:
  checkout:
    delay: 2s
  inventory:
    # Set to true to make the inventory health check pass.
    available: false
