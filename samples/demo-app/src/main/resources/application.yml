spring:
  application:
    name: order-service
  ai:
    mcp:
      server:
        name: order-service
        version: 0.1.0
        # Streamable HTTP on /mcp. Without this, Spring AI falls back to the older SSE transport on /sse.
        protocol: STREAMABLE

boot-mcp-doctor:
  enabled: true
  # Set to false to also register set_log_level.
  read-only: true

demo:
  checkout:
    delay: 2s
  inventory:
    # Set to true to make the inventory health check pass.
    available: false
